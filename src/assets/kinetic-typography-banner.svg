<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <radialGradient id="kt-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="60%" stop-color="#0e071c" />
      <stop offset="100%" stop-color="#05020a" />
    </radialGradient>
    <radialGradient id="kt-purple-orb" cx="75%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#7e22ce" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="kt-cyan-orb" cx="25%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#0891b2" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="kt-text-grad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e9d5ff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="kt-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="kt-gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="kt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#a855f7" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="720" fill="url(#kt-bg)" />
  <rect width="1280" height="720" fill="url(#kt-purple-orb)" />
  <rect width="1280" height="720" fill="url(#kt-cyan-orb)" />

  <!-- Dynamic Typography Perspective Wireframe Grids -->
  <g opacity="0.18" stroke="#a855f7" stroke-width="1">
    <line x1="0" y1="360" x2="1280" y2="360" stroke-dasharray="8 6" />
    <line x1="0" y1="200" x2="1280" y2="200" stroke-dasharray="4 4" />
    <line x1="0" y1="520" x2="1280" y2="520" stroke-dasharray="4 4" />
    <line x1="640" y1="0" x2="640" y2="720" stroke-dasharray="8 6" />
    <line x1="320" y1="0" x2="320" y2="720" stroke-dasharray="4 4" />
    <line x1="960" y1="0" x2="960" y2="720" stroke-dasharray="4 4" />
  </g>

  <!-- Floating 3D Kinetic Bezier Curves -->
  <path d="M 120,560 C 320,180 720,620 1160,220" fill="none" stroke="url(#kt-cyan-grad)" stroke-width="3" opacity="0.45" stroke-dasharray="12 6" />
  <path d="M 80,480 C 280,680 820,120 1200,420" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.35" />

  <!-- Central Kinetic Typography Art Frame -->
  <g transform="translate(640, 360)">
    <!-- Back Glow -->
    <circle cx="0" cy="0" r="260" fill="#a855f7" opacity="0.08" filter="blur(40px)" />
    
    <!-- Outer Kinetic Orbital Ring with Rotation Ticks -->
    <circle cx="0" cy="0" r="230" fill="none" stroke="rgba(168,85,247,0.3)" stroke-width="2" stroke-dasharray="10 8" />
    <circle cx="0" cy="0" r="200" fill="none" stroke="rgba(34,211,238,0.25)" stroke-width="1.5" stroke-dasharray="6 12" />

    <!-- Isometric Ae Badge -->
    <g transform="translate(-360, -180)">
      <rect x="0" y="0" width="80" height="80" rx="20" fill="#0d041a" stroke="rgba(168,85,247,0.6)" stroke-width="2" />
      <text x="40" y="52" text-anchor="middle" fill="#c084fc" font-family="'Tomato Grotesk', system-ui, sans-serif" font-weight="800" font-size="34">Ae</text>
    </g>

    <!-- Category Pill -->
    <g transform="translate(0, -170)">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="rgba(168,85,247,0.18)" stroke="rgba(168,85,247,0.5)" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" fill="#e9d5ff" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="2">AFTER EFFECTS &amp; VFX</text>
    </g>

    <!-- Main Title Typography: KINETIC -->
    <text x="0" y="-40" text-anchor="middle" fill="url(#kt-text-grad)" font-family="'Tomato Grotesk', system-ui, sans-serif" font-weight="900" font-size="82" letter-spacing="4" filter="url(#kt-glow)">
      KINETIC
    </text>
    <!-- Main Title Typography: TYPOGRAPHY -->
    <text x="0" y="55" text-anchor="middle" fill="#ffffff" font-family="'Tomato Grotesk', system-ui, sans-serif" font-weight="900" font-size="74" letter-spacing="6">
      TYPOGRAPHY
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="115" text-anchor="middle" fill="#22d3ee" font-family="'Tomato Grotesk', system-ui, sans-serif" font-weight="600" font-size="20" letter-spacing="3">
      HIGH-RETENTION MOTION &amp; VISUAL PACING
    </text>

    <!-- Lower Status Indicators -->
    <g transform="translate(0, 160)">
      <rect x="-160" y="-16" width="320" height="32" rx="16" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <circle cx="-135" cy="0" r="5" fill="#22d3ee" />
      <text x="5" y="5" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="sans-serif" font-size="12" font-weight="bold">
        Keyframe Graph Editor &bull; 3D Camera Rigs
      </text>
    </g>
  </g>

  <!-- Corner Decorative Marks -->
  <g stroke="rgba(168,85,247,0.4)" stroke-width="2" fill="none">
    <path d="M 40,70 L 40,40 L 70,40" />
    <path d="M 1240,70 L 1240,40 L 1210,40" />
    <path d="M 40,650 L 40,680 L 70,680" />
    <path d="M 1240,650 L 1240,680 L 1210,680" />
  </g>
</svg>
