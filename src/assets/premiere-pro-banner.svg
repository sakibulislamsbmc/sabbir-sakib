<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <radialGradient id="pr-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#180d28" />
      <stop offset="60%" stop-color="#0a0512" />
      <stop offset="100%" stop-color="#030106" />
    </radialGradient>
    <radialGradient id="pr-magenta-glow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#9f1239" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pr-violet-glow" cx="20%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#6d28d9" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pr-title-grad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="pr-timeline-clip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="pr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#f43f5e" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#pr-bg)" />
  <rect width="1280" height="720" fill="url(#pr-magenta-glow)" />
  <rect width="1280" height="720" fill="url(#pr-violet-glow)" />

  <!-- Background Timeline Grid Lines -->
  <g opacity="0.15" stroke="#f43f5e" stroke-width="1">
    <line x1="0" y1="240" x2="1280" y2="240" stroke-dasharray="10 5" />
    <line x1="0" y1="360" x2="1280" y2="360" stroke-dasharray="10 5" />
    <line x1="0" y1="480" x2="1280" y2="480" stroke-dasharray="10 5" />
    <line x1="320" y1="0" x2="320" y2="720" stroke-dasharray="5 5" />
    <line x1="640" y1="0" x2="640" y2="720" stroke-dasharray="10 5" />
    <line x1="960" y1="0" x2="960" y2="720" stroke-dasharray="5 5" />
  </g>

  <!-- Central Title and Graphic -->
  <g transform="translate(640, 360)">
    <!-- Back Glow -->
    <circle cx="0" cy="0" r="250" fill="#f43f5e" opacity="0.07" filter="blur(40px)" />

    <!-- Isometric Pr Badge -->
    <g transform="translate(-360, -180)">
      <rect x="0" y="0" width="80" height="80" rx="20" fill="#15031a" stroke="rgba(244,63,94,0.6)" stroke-width="2" />
      <text x="40" y="52" text-anchor="middle" fill="#fda4af" font-family="'Tomato Grotesk', system-ui, sans-serif" font-weight="800" font-size="34">Pr</text>
    </g>

    <!-- Category Pill -->
    <g transform="translate(0, -170)">
      <rect x="-150" y="-18" width="300" height="36" rx="18" fill="rgba(244,63,94,0.18)" stroke="rgba(244,63,94,0.5)" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" fill="#fecdd3" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="2">PREMIERE PRO &bull; TIMELINE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="-40" text-anchor="middle" fill="url(#pr-title-grad)" font-family="'Tomato Grotesk', system-ui, sans-serif" font-weight="900" font-size="80" letter-spacing="4" filter="url(#pr-glow)">
      COMMERCIAL
    </text>
    <text x="0" y="55" text-anchor="middle" fill="#ffffff" font-family="'Tomato Grotesk', system-ui, sans-serif" font-weight="900" font-size="74" letter-spacing="6">
      VIDEO EDITING
    </text>

    <!-- Subtitle -->
    <text x="0" y="115" text-anchor="middle" fill="#f43f5e" font-family="'Tomato Grotesk', system-ui, sans-serif" font-weight="600" font-size="20" letter-spacing="3">
      SOUND DESIGN &bull; PACING &bull; HIGH RETENTION
    </text>

    <!-- Bottom Timeline Bar Preview -->
    <g transform="translate(0, 160)">
      <rect x="-240" y="-16" width="480" height="32" rx="16" fill="rgba(0,0,0,0.65)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <rect x="-220" y="-8" width="130" height="16" rx="4" fill="rgba(99,102,241,0.5)" />
      <rect x="-80" y="-8" width="110" height="16" rx="4" fill="rgba(244,63,94,0.55)" />
      <rect x="40" y="-8" width="170" height="16" rx="4" fill="rgba(245,158,11,0.5)" />
      <!-- Red Playhead Needle -->
      <line x1="-30" y1="-14" x2="-30" y2="14" stroke="#ef4444" stroke-width="2" />
    </g>
  </g>

  <!-- Frame Corners -->
  <g stroke="rgba(244,63,94,0.4)" stroke-width="2" fill="none">
    <path d="M 40,70 L 40,40 L 70,40" />
    <path d="M 1240,70 L 1240,40 L 1210,40" />
    <path d="M 40,650 L 40,680 L 70,680" />
    <path d="M 1240,650 L 1240,680 L 1210,680" />
  </g>
</svg>
