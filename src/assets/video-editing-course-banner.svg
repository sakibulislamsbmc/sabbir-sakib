<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradients -->
    <radialGradient id="ve-bg-glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a0826" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#120418" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#050109" />
    </radialGradient>
    <radialGradient id="ve-rose-orb" cx="72%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#be123c" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ve-orange-orb" cx="28%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#9a3412" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients for UI & Geometry -->
    <linearGradient id="ve-grid-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0" />
      <stop offset="60%" stop-color="#f43f5e" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="ve-film-grad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="40%" stop-color="#fb7185" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <linearGradient id="ve-card-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="ve-camera-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="50%" stop-color="#171717" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>

    <linearGradient id="ve-lens-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <linearGradient id="ve-flare" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0" />
      <stop offset="45%" stop-color="#fda4af" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="55%" stop-color="#f97316" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="ve-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="ve-heavy-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="720" fill="#08020b" />
  <rect width="1280" height="720" fill="url(#ve-bg-glow)" />
  <circle cx="920" cy="300" r="420" fill="url(#ve-rose-orb)" />
  <circle cx="360" cy="520" r="380" fill="url(#ve-orange-orb)" />

  <!-- Isometric Cyber Grid Floor -->
  <g opacity="0.35">
    <path d="M 0,720 L 640,460 L 1280,720" stroke="url(#ve-grid-grad)" stroke-width="1.5" fill="none" />
    <path d="M 0,660 L 640,460 L 1280,660" stroke="url(#ve-grid-grad)" stroke-width="1.2" fill="none" />
    <path d="M 0,600 L 640,460 L 1280,600" stroke="url(#ve-grid-grad)" stroke-width="1" fill="none" />
    <line x1="120" y1="720" x2="640" y2="460" stroke="#f43f5e" stroke-width="0.8" opacity="0.4" />
    <line x1="280" y1="720" x2="640" y2="460" stroke="#f43f5e" stroke-width="0.8" opacity="0.4" />
    <line x1="460" y1="720" x2="640" y2="460" stroke="#f43f5e" stroke-width="0.8" opacity="0.4" />
    <line x1="820" y1="720" x2="640" y2="460" stroke="#f43f5e" stroke-width="0.8" opacity="0.4" />
    <line x1="1000" y1="720" x2="640" y2="460" stroke="#f43f5e" stroke-width="0.8" opacity="0.4" />
    <line x1="1160" y1="720" x2="640" y2="460" stroke="#f43f5e" stroke-width="0.8" opacity="0.4" />
  </g>

  <!-- Star Dust Particles -->
  <g opacity="0.6">
    <circle cx="140" cy="110" r="1.5" fill="#ffffff" />
    <circle cx="280" cy="180" r="1.2" fill="#fb7185" />
    <circle cx="420" cy="80" r="2" fill="#ffffff" opacity="0.9" />
    <circle cx="560" cy="210" r="1" fill="#facc15" />
    <circle cx="700" cy="95" r="1.5" fill="#fda4af" />
    <circle cx="850" cy="160" r="2.2" fill="#ffffff" />
    <circle cx="980" cy="70" r="1.5" fill="#f97316" />
    <circle cx="1120" cy="140" r="1.8" fill="#ffffff" />
    <circle cx="1200" cy="240" r="1.2" fill="#fb7185" />
    <circle cx="180" cy="420" r="1.5" fill="#fda4af" />
    <circle cx="1150" cy="560" r="2" fill="#facc15" />
  </g>

  <!-- 3D Orbiting Film Ribbon Wave (Foreground Dynamics) -->
  <path d="M -50,560 C 220,580 340,360 580,390 C 820,420 920,260 1340,290" 
        stroke="url(#ve-film-grad)" stroke-width="26" stroke-linecap="round" fill="none" opacity="0.3" filter="url(#ve-glow)" />
  <path d="M -50,560 C 220,580 340,360 580,390 C 820,420 920,260 1340,290" 
        stroke="url(#ve-film-grad)" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.85" />

  <!-- Perforations on Ribbon -->
  <g fill="#0b0210" opacity="0.9">
    <rect x="80" y="553" width="7" height="12" rx="2" transform="rotate(2 80 553)" />
    <rect x="140" y="546" width="7" height="12" rx="2" transform="rotate(-6 140 546)" />
    <rect x="220" y="515" width="7" height="12" rx="2" transform="rotate(-18 220 515)" />
    <rect x="300" y="445" width="7" height="12" rx="2" transform="rotate(-26 300 445)" />
    <rect x="390" y="380" width="7" height="12" rx="2" transform="rotate(-4 390 380)" />
    <rect x="480" y="375" width="7" height="12" rx="2" transform="rotate(8 480 375)" />
    <rect x="580" y="385" width="7" height="12" rx="2" transform="rotate(6 580 385)" />
    <rect x="680" y="392" width="7" height="12" rx="2" transform="rotate(-6 680 392)" />
    <rect x="780" y="370" width="7" height="12" rx="2" transform="rotate(-20 780 370)" />
    <rect x="880" y="305" width="7" height="12" rx="2" transform="rotate(-22 880 305)" />
    <rect x="990" y="272" width="7" height="12" rx="2" transform="rotate(4 990 272)" />
    <rect x="1100" y="276" width="7" height="12" rx="2" transform="rotate(6 1100 276)" />
    <rect x="1200" y="284" width="7" height="12" rx="2" transform="rotate(4 1200 284)" />
  </g>

  <!-- Left Hero Typography & Badges Block -->
  <g transform="translate(80, 80)">
    <!-- Top Pill Track & Session Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="34" rx="17" fill="#f43f5e" fill-opacity="0.18" stroke="#f43f5e" stroke-width="1.2" />
      <circle cx="18" cy="17" r="5" fill="#f43f5e" filter="url(#ve-glow)" />
      <circle cx="18" cy="17" r="3" fill="#ffffff" />
      <text x="32" y="22" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fecdd3" letter-spacing="1.5">
        VIDEO EDITING &bull; LIVE
      </text>
    </g>

    <!-- Masterclass Heading -->
    <text x="0" y="85" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#fb7185" letter-spacing="4">
      BISMAHSOFT ACADEMY MASTERCLASS
    </text>

    <!-- Main Course Title in Bold Dynamic Layered Typography -->
    <text x="0" y="160" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">
      CINEMATIC
    </text>
    <text x="0" y="225" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="60" font-weight="900" fill="url(#ve-film-grad)" letter-spacing="-1">
      VIDEO EDITING
    </text>
    <text x="0" y="280" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#fecdd3" letter-spacing="1">
      &amp; MOTION GRAPHICS
    </text>

    <!-- Subtitle Bullet Features -->
    <g transform="translate(0, 320)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#fda4af">
        Craft Visual Stories &bull; Pacing &bull; Hollywood Color Grading &bull; VFX
      </text>
      <text x="0" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#e2e8f0" opacity="0.8">
        Premiere Pro &bull; After Effects &bull; CapCut Desktop &bull; Sound Design
      </text>
    </g>

    <!-- Stat Badges Row -->
    <g transform="translate(0, 395)">
      <!-- Badge 1: 24+ Live Classes -->
      <g>
        <rect x="0" y="0" width="135" height="52" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" />
        <text x="16" y="24" font-family="system-ui" font-size="18" font-weight="800" fill="#ffffff">24+ Class</text>
        <text x="16" y="42" font-family="system-ui" font-size="11" font-weight="600" fill="#fb7185">Live Mentorship</text>
      </g>

      <!-- Badge 2: Sound Pack Included -->
      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="150" height="52" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" />
        <text x="16" y="24" font-family="system-ui" font-size="18" font-weight="800" fill="#facc15">15GB+ FX</text>
        <text x="16" y="42" font-family="system-ui" font-size="11" font-weight="600" fill="#fef08a">Sound &amp; LUTs Pack</text>
      </g>

      <!-- Badge 3: 4.9 Rating -->
      <g transform="translate(315, 0)">
        <rect x="0" y="0" width="115" height="52" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" />
        <text x="16" y="24" font-family="system-ui" font-size="18" font-weight="800" fill="#34d399">&#9733; 4.9/5</text>
        <text x="16" y="42" font-family="system-ui" font-size="11" font-weight="600" fill="#a7f3d0">Top Rated</text>
      </g>
    </g>

    <!-- Mentor Tag -->
    <g transform="translate(0, 485)">
      <text x="0" y="16" font-family="system-ui" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="0.5">
        Instructor: <tspan fill="#f43f5e">Sakibul Islam Sabbir</tspan> &bull; Founder @ Bismahsoft Academy
      </text>
    </g>
  </g>

  <!-- Right Visual 3D Composition (Hero Cinema Rig & Hologram Timeline) -->
  <g transform="translate(860, 360)">
    <!-- Ambient Halo Glow behind 3D elements -->
    <circle cx="0" cy="0" r="220" fill="#f43f5e" fill-opacity="0.22" filter="url(#ve-heavy-glow)" />

    <!-- 3D Holographic Timeline Card (Floating Angle) -->
    <g transform="rotate(-12) translate(-160, -180)">
      <!-- Glass Plate -->
      <rect x="0" y="0" width="340" height="200" rx="24" fill="url(#ve-card-glass)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" filter="url(#ve-glow)" />
      
      <!-- Timeline Header -->
      <rect x="18" y="18" width="50" height="8" rx="4" fill="#fb7185" opacity="0.8" />
      <circle cx="280" cy="22" r="4" fill="#f43f5e" />
      <circle cx="295" cy="22" r="4" fill="#facc15" />
      <circle cx="310" cy="22" r="4" fill="#34d399" />
      
      <!-- Video Track 1 -->
      <rect x="18" y="42" width="304" height="28" rx="8" fill="#f43f5e" fill-opacity="0.25" stroke="#f43f5e" stroke-width="1" />
      <rect x="24" y="46" width="110" height="20" rx="6" fill="#be123c" />
      <rect x="140" y="46" width="85" height="20" rx="6" fill="#fb7185" />
      <rect x="232" y="46" width="84" height="20" rx="6" fill="#f97316" />

      <!-- Video Track 2 (Overlay / B-Roll) -->
      <rect x="18" y="78" width="304" height="28" rx="8" fill="#f97316" fill-opacity="0.2" stroke="#f97316" stroke-width="1" />
      <rect x="50" y="82" width="140" height="20" rx="6" fill="#ea580c" />
      <rect x="198" y="82" width="118" height="20" rx="6" fill="#f59e0b" />

      <!-- Audio Waveform Track -->
      <rect x="18" y="114" width="304" height="34" rx="8" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
      <!-- Waveform Bars -->
      <g fill="#38bdf8" opacity="0.85">
        <rect x="26" y="126" width="3" height="10" rx="1.5" />
        <rect x="34" y="121" width="3" height="20" rx="1.5" />
        <rect x="42" y="124" width="3" height="14" rx="1.5" />
        <rect x="50" y="118" width="3" height="26" rx="1.5" />
        <rect x="58" y="123" width="3" height="16" rx="1.5" />
        <rect x="66" y="120" width="3" height="22" rx="1.5" />
        <rect x="74" y="125" width="3" height="12" rx="1.5" />
        <rect x="82" y="119" width="3" height="24" rx="1.5" />
        <rect x="90" y="122" width="3" height="18" rx="1.5" />
        <rect x="98" y="127" width="3" height="8" rx="1.5" />
        <rect x="106" y="120" width="3" height="22" rx="1.5" />
        <rect x="114" y="118" width="3" height="26" rx="1.5" />
        <rect x="122" y="124" width="3" height="14" rx="1.5" />
        <rect x="130" y="121" width="3" height="20" rx="1.5" />
        <rect x="138" y="125" width="3" height="12" rx="1.5" />
        <rect x="146" y="119" width="3" height="24" rx="1.5" />
        <rect x="154" y="122" width="3" height="18" rx="1.5" />
        <rect x="162" y="118" width="3" height="26" rx="1.5" />
        <rect x="170" y="124" width="3" height="14" rx="1.5" />
        <rect x="178" y="120" width="3" height="22" rx="1.5" />
        <rect x="186" y="125" width="3" height="12" rx="1.5" />
        <rect x="194" y="119" width="3" height="24" rx="1.5" />
        <rect x="202" y="122" width="3" height="18" rx="1.5" />
        <rect x="210" y="126" width="3" height="10" rx="1.5" />
        <rect x="218" y="120" width="3" height="22" rx="1.5" />
        <rect x="226" y="118" width="3" height="26" rx="1.5" />
        <rect x="234" y="124" width="3" height="14" rx="1.5" />
        <rect x="242" y="121" width="3" height="20" rx="1.5" />
        <rect x="250" y="125" width="3" height="12" rx="1.5" />
        <rect x="258" y="119" width="3" height="24" rx="1.5" />
        <rect x="266" y="123" width="3" height="16" rx="1.5" />
        <rect x="274" y="127" width="3" height="8" rx="1.5" />
        <rect x="282" y="122" width="3" height="18" rx="1.5" />
        <rect x="290" y="120" width="3" height="22" rx="1.5" />
        <rect x="298" y="125" width="3" height="12" rx="1.5" />
        <rect x="306" y="123" width="3" height="16" rx="1.5" />
      </g>

      <!-- Scrubber Playhead Line -->
      <line x1="165" y1="36" x2="165" y2="155" stroke="#ffffff" stroke-width="2.5" />
      <polygon points="160,36 170,36 165,44" fill="#ffffff" />
    </g>

    <!-- 3D Cinema Camera Hero Rig (Centerpiece) -->
    <g transform="translate(10, 30)">
      <!-- Main Camera Body -->
      <rect x="-90" y="-60" width="180" height="120" rx="20" fill="url(#ve-camera-body)" stroke="#404040" stroke-width="2" />
      
      <!-- Top Handle -->
      <path d="M -50,-60 L -50,-90 L 50,-90 L 50,-60" stroke="#525252" stroke-width="12" stroke-linecap="round" fill="none" />
      
      <!-- Battery / Viewfinder Prism -->
      <rect x="65" y="-45" width="45" height="70" rx="10" fill="#171717" stroke="#fb7185" stroke-width="1.5" />
      <circle cx="88" cy="-10" r="14" fill="#be123c" opacity="0.6" />

      <!-- Massive Cinematic Lens Barrel -->
      <rect x="-145" y="-45" width="60" height="90" rx="12" fill="#1c1917" stroke="url(#ve-lens-rim)" stroke-width="2.5" />
      
      <!-- Front Glass Element Ring -->
      <ellipse cx="-145" cy="0" rx="20" ry="42" fill="#09090b" stroke="#f43f5e" stroke-width="3" filter="url(#ve-glow)" />
      <!-- Inner Anamorphic Lens Flare Beam -->
      <ellipse cx="-145" cy="0" rx="10" ry="30" fill="#38bdf8" opacity="0.8" />
      <ellipse cx="-145" cy="0" rx="4" ry="16" fill="#ffffff" />

      <!-- Horizontal Anamorphic Lens Flare Streak -->
      <rect x="-420" y="-4" width="840" height="8" fill="url(#ve-flare)" opacity="0.85" filter="url(#ve-glow)" />

      <!-- 3D Floating Play Prism -->
      <g transform="translate(70, 70)">
        <polygon points="0,-35 45,0 0,35" fill="url(#ve-film-grad)" filter="url(#ve-glow)" />
        <polygon points="-8,-38 48,-2 0,38" fill="#ffffff" opacity="0.3" />
        <polygon points="5,-24 35,0 5,24" fill="#ffffff" />
      </g>
    </g>

    <!-- Keyframe Diamond Nodes Orbiting -->
    <g transform="rotate(25)">
      <rect x="-170" y="-80" width="16" height="16" rx="3" transform="rotate(45 -170 -80)" fill="#facc15" stroke="#ffffff" stroke-width="1.5" filter="url(#ve-glow)" />
      <rect x="180" y="-120" width="20" height="20" rx="3" transform="rotate(45 180 -120)" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5" filter="url(#ve-glow)" />
      <rect x="140" y="130" width="16" height="16" rx="3" transform="rotate(45 140 130)" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" filter="url(#ve-glow)" />
    </g>
  </g>

  <!-- Top Right Watermark & Year -->
  <g transform="translate(1120, 60)">
    <text x="0" y="0" text-anchor="end" font-family="'Space Grotesk', system-ui" font-size="13" font-weight="700" fill="#ffffff" opacity="0.4" letter-spacing="2">
      EDITION 2026 &bull; OFFICIAL
    </text>
  </g>
</svg>
